<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | PHOMO SHOP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- خط نورانی بالای صفحه -->
  <div class="glowing-line"></div>

  <!-- هدر پنل مدیریت -->
  <header>
    <button class="btn" id="logoutBtn">خروج</button>
    <button class="btn" id="adminInfoBtn">اطلاعات مدیر</button>
    <button class="btn btn-icon" id="addProductBtn">+</button>
  </header>

  <!-- لیست محصولات مدیریت -->
  <main>
    <div class="products-container" id="adminProductsList">
      <!-- محصولات مدیریت اینجا رندر می‌شوند -->
    </div>
  </main>

  <!-- پاپ‌آپ تغییر اطلاعات مدیر -->
  <div class="modal-overlay" id="adminInfoModal">
    <div class="modal-content">
      <div class="modal-header">تغییر اطلاعات مدیر</div>
      <div class="form-group">
        <label>نام کاربری جدید</label>
        <input type="text" id="newAdminUser" class="input-field" placeholder="نام کاربری جدید">
      </div>
      <div class="form-group">
        <label>رمز عبور جدید</label>
        <input type="password" id="newAdminPass" class="input-field" placeholder="رمز عبور جدید">
      </div>
      <div class="modal-buttons">
        <button class="btn" id="closeAdminInfoModal">انصراف</button>
        <button class="btn" id="saveAdminInfo">ذخیره تغییرات</button>
      </div>
    </div>
  </div>

  <!-- پاپ‌آپ انتخاب نوع محصول -->
  <div class="modal-overlay" id="typeSelectModal">
    <div class="modal-content">
      <div class="modal-header">انتخاب نوع محصول</div>
      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <button class="btn" id="addGameTypeBtn">اضافه کردن محصول بازی</button>
        <button class="btn" id="addVirtualTypeBtn">اضافه کردن محصول مجازی</button>
      </div>
      <div class="modal-buttons" style="margin-top: 15px;">
        <button class="btn" id="closeTypeModal">انصراف</button>
      </div>
    </div>
  </div>

  <!-- پاپ‌آپ فرم محصول (افزودن / ویرایش) -->
  <div class="modal-overlay" id="productFormModal">
    <div class="modal-content" style="max-height: 85vh; overflow-y: auto;">
      <div class="modal-header" id="formModalTitle">افزودن محصول</div>
      
      <input type="hidden" id="editProductId">
      <input type="hidden" id="productType">

      <div class="form-group">
        <label>نام محصول</label>
        <input type="text" id="pName" class="input-field">
      </div>

      <div class="form-group">
        <label>قیمت اصلی (خط خورده)</label>
        <input type="text" id="pOrigPrice" class="input-field">
      </div>

      <div class="form-group">
        <label>قیمت آفر</label>
        <input type="text" id="pOfferPrice" class="input-field">
      </div>

      <!-- فیلد اختصاصی بازی -->
      <div class="form-group" id="gameLevelGroup">
        <label>لول اکانت بازی</label>
        <input type="text" id="pGameLevel" class="input-field">
      </div>

      <!-- فیلد اختصاصی مجازی -->
      <div class="form-group" id="virtualCountGroup">
        <label>تعداد ممبر / فالوور</label>
        <input type="text" id="pVirtualCount" class="input-field">
      </div>

      <div class="form-group">
        <label>توضیحات اضافی</label>
        <textarea id="pDesc" class="input-field"></textarea>
      </div>

      <div class="form-group">
        <label>شماره کارت صاحب محصول</label>
        <input type="text" id="pCardNum" class="input-field">
      </div>

      <div class="form-group">
        <label>نام صاحب شماره کارت</label>
        <input type="text" id="pCardName" class="input-field">
      </div>

      <div class="form-group">
        <label>آیدی روبیکای صاحب محصول (بدون @)</label>
        <input type="text" id="pRubikaId" class="input-field">
      </div>

      <div class="modal-buttons">
        <button class="btn" id="closeFormModal">انصراف</button>
        <button class="btn" id="saveProductBtn">افزودن محصول</button>
      </div>
    </div>
  </div>

  <!-- پاپ‌آپ پیام‌ها (Alert) -->
  <div class="modal-overlay" id="alertModal">
    <div class="modal-content">
      <div class="modal-header" id="alertTitle">اطلاعیه</div>
      <div id="alertMsg" style="text-align: center; font-size: 0.95rem;"></div>
      <div class="modal-buttons" style="justify-content: center;">
        <button class="btn" id="closeAlertModal">تایید</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
  </html>
